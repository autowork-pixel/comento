<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>코멘토 광고 실습실</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#172239;background:#f4f6fa}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid #dce2ec;padding:18px max(24px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px;color:#2449c6}.badge{font-size:13px;background:#eaf0ff;color:#2449c6;padding:7px 10px;border-radius:6px}main{max-width:1180px;margin:32px auto;padding:0 20px}.hero{margin-bottom:28px}.hero h1{margin:0 0 8px;font-size:29px}.hero p{margin:0;color:#5b677b;line-height:1.6}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px}.nav,.panel{background:white;border:1px solid #dce2ec;border-radius:12px;box-shadow:0 2px 10px #192d5110}.nav{padding:14px;height:max-content}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:13px;border-radius:8px;color:#39475f}.nav button.active{background:#eaf0ff;color:#2449c6;font-weight:700}.panel{padding:26px}.panel h2{font-size:20px;margin:0 0 6px}.sub{color:#6a7689;margin:0 0 24px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{display:flex;flex-direction:column;gap:7px;font-weight:650;font-size:14px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid #cfd7e3;border-radius:8px;padding:11px 12px;background:#fff;color:#172239;min-width:0}.field textarea{min-height:94px;resize:vertical}.field small{font-weight:400;color:#718096}.section{border-top:1px solid #e5e9f0;margin-top:24px;padding-top:22px}.section h3{margin:0 0 16px;font-size:17px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}.primary,.secondary{border-radius:8px;padding:12px 18px;font-weight:700}.primary{background:#2854d8;color:white;border:1px solid #2854d8}.secondary{background:white;color:#34435e;border:1px solid #cbd4e2}.note{background:#fff8e8;border:1px solid #f1dfad;border-radius:8px;padding:12px 14px;color:#735716;font-size:14px;line-height:1.5;margin-bottom:22px}.results{display:none}.results.show{display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border:1px solid #dce2ec;border-radius:8px;padding:16px}.metric span{display:block;color:#6a7689;font-size:13px}.metric strong{display:block;font-size:23px;margin-top:7px}.explain{line-height:1.65;color:#43516a}.error{color:#bc3030;font-size:14px;min-height:22px}@media(max-width:760px){.layout{display:block}.nav{display:flex;overflow:auto;margin-bottom:16px}.nav button{white-space:nowrap}.grid,.metrics{grid-template-columns:1fr}.panel{padding:20px}.top{padding:16px 20px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">코멘토 광고 실습실</div><div class="badge">교육용 시뮬레이션</div></header>
  <main>
    <div class="hero"><h1>광고 캠페인을 설계하고 결과를 해석하세요</h1><p id="welcome">메타와 네이버 파워링크의 설정 흐름을 연습합니다. 표시되는 성과는 실제 광고 집행 결과가 아닙니다.</p></div>
    <div class="layout">
      <nav class="nav" aria-label="캠페인 유형"><button class="active" data-type="traffic">메타 · 트래픽</button><button data-type="conversion">메타 · 전환</button><button data-type="search">네이버 · 파워링크</button></nav>
      <div><section class="panel"><h2 id="title">메타 트래픽 캠페인</h2><p class="sub" id="description">브랜디드 콘텐츠로 잠재고객의 랜딩페이지 방문을 유도합니다.</p><div class="note">이 화면은 광고 관리자 학습용 모의 화면입니다. 예산은 실제 결제되지 않으며, 결과는 입력값과 교육용 가정으로 계산한 추정치입니다.</div>
        <form id="form"><div class="grid"><label class="field">제품·서비스명<input name="product" required placeholder="예: 온라인 영어 회화"></label><label class="field">캠페인명<input name="campaign" required placeholder="예: 2027 봄 신규 고객"></label><label class="field">7일 총예산 (원)<input name="budget" type="number" min="10000" max="10000000" value="1000000" required></label><label class="field">목표 고객<input name="audience" required placeholder="예: 20대 취업 준비생"></label></div>
          <div class="section"><h3 id="creativeTitle">광고 소재</h3><div class="grid"><label class="field full">핵심 메시지<textarea name="message" required placeholder="고객에게 전달할 가치와 행동 유도를 작성하세요"></textarea></label><label class="field">랜딩페이지 URL<input name="landing" type="url" placeholder="https://example.com"></label><label class="field">소재 이미지<input name="creative" type="file" accept="image/*"><small>이 첫 버전에서는 이미지가 기기에만 표시되며 서버에 업로드되지 않습니다.</small></label><label class="field full" id="keywordsField" hidden>키워드 (쉼표로 구분)<textarea name="keywords" placeholder="예: 영어회화, 직장인 영어회화"></textarea></label><label class="field" id="bidField" hidden>키워드 입찰가 (원)<input name="bid" type="number" min="70" value="1000"></label></div></div>
          <div class="actions"><button type="button" class="secondary" id="reset">초기화</button><button class="primary" type="submit">7일 결과 시뮬레이션</button></div><p class="error" id="error" role="alert"></p></form></section>
        <section class="panel results" id="results" style="margin-top:20px"><h2>7일 성과 추정</h2><p class="sub">실제 성과 예측이나 광고 플랫폼 제공 수치가 아닙니다.</p><div class="metrics" id="metrics"></div><div class="section"><h3>결과를 읽는 방법</h3><p class="explain" id="explain"></p><p class="explain" id="assumptions"></p></div></section></div>
    </div>
  </main>
  <script>
    const config={traffic:{title:'메타 트래픽 캠페인',description:'브랜디드 콘텐츠로 잠재고객의 랜딩페이지 방문을 유도합니다.',ctr:.012,cpc:650},conversion:{title:'메타 전환 캠페인',description:'광고용 콘텐츠로 구매·상담 신청·회원가입을 유도합니다.',ctr:.009,cpc:950},search:{title:'네이버 파워링크 캠페인',description:'키워드와 광고 문구를 설정해 검색광고를 연습합니다.',ctr:.035,cpc:1100}};
    let type='traffic';const form=document.getElementById('form');const params=new URLSearchParams(location.search);const learner=params.get('learner');if(learner)document.getElementById('welcome').textContent=`${learner}님의 광고 실습실입니다. 표시되는 성과는 실제 광고 집행 결과가 아닙니다.`;
    document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{type=button.dataset.type;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b===button));document.getElementById('title').textContent=config[type].title;document.getElementById('description').textContent=config[type].description;document.getElementById('keywordsField').hidden=type!=='search';document.getElementById('bidField').hidden=type!=='search';document.getElementById('creativeTitle').textContent=type==='search'?'검색 키워드와 광고 문구':'광고 소재';document.getElementById('results').classList.remove('show')}));
    document.getElementById('reset').addEventListener('click',()=>{form.reset();document.getElementById('results').classList.remove('show')});
    form.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(form),budget=Number(data.get('budget')),message=String(data.get('message')).trim(),keywords=String(data.get('keywords')).split(',').map(s=>s.trim()).filter(Boolean);if(type==='search'&&!keywords.length){document.getElementById('error').textContent='파워링크 키워드를 하나 이상 입력하세요.';return}document.getElementById('error').textContent='';const base=config[type],cpc=type==='search'?Math.max(70,Math.round((Number(data.get('bid'))+base.cpc)/2)):base.cpc;const clicks=Math.min(Math.floor(budget/cpc),type==='search'?keywords.length*2500:100000);const impressions=Math.round(clicks/base.ctr);const spent=clicks*cpc;const conversionRate=type==='conversion'?.025:type==='search'?.018:.008;const conversions=Math.round(clicks*conversionRate);const values=[['추정 노출',impressions.toLocaleString()+'회'],['추정 클릭',clicks.toLocaleString()+'회'],['추정 CPC',cpc.toLocaleString()+'원'],[type==='traffic'?'가정상 전환':'추정 전환',conversions.toLocaleString()+'건']];document.getElementById('metrics').replaceChildren(...values.map(([label,value])=>{const el=document.createElement('div');el.className='metric';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=label;b.textContent=value;el.append(a,b);return el}));document.getElementById('explain').textContent=`7일 예산 ${budget.toLocaleString()}원 중 ${spent.toLocaleString()}원이 사용된 것으로 계산했습니다. ${type==='search'?`입력 키워드 ${keywords.length}개를 반영했습니다. `:''}소재와 타깃의 실제 품질은 아직 점수에 반영되지 않습니다. 어떤 문구와 타깃을 바꾸면 결과가 달라질지 설명해 보세요.`;document.getElementById('assumptions').textContent=`교육용 고정 가정: CTR ${(base.ctr*100).toFixed(1)}%, 전환율 ${(conversionRate*100).toFixed(1)}%, CPC ${cpc.toLocaleString()}원. 네이버 검색량 API와 AI 소재 평가는 아직 연결되지 않았습니다.`;document.getElementById('results').classList.add('show');document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'})});
  </script>
</body>
</html>
